dataset: orders
resource: orders
target_table: ods_order
encoding: utf-8-sig
delimiter: ","
window_column: pay_at
key_columns: [order_id]
required: [order_id]
datetime_columns: [pay_at, create_at, update_at]
decimal_columns: [pay_amount]
on_error: skip
fields:
  订单编号: order_id
  order_id: order_id
  店铺ID: shop_id
  shop_id: shop_id
  订单状态: order_status
  order_status: order_status
  实付金额: pay_amount
  pay_amount: pay_amount
  支付时间: pay_at
  pay_at: pay_at
  下单时间: create_at
  create_at: create_at
  更新时间: update_at
  update_at: update_at
  达人ID: talent_id
  talent_id: talent_id
  直播间ID: room_id
  room_id: room_id
  渠道类型: channel_type
  channel_type: channel_type
  内容类型: content_type
  content_type: content_type
